name: Build GhostPDL for Windows ARM64

on:
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------------
  # Job 1: Build using MSYS2 LLVM-MinGW (CLANGARM64)
  # Recommended: Highly automated and reliable with GhostPDL's Autotools
  # ----------------------------------------------------------------------
  build-msys2-clangarm64:
    name: Build (MSYS2 Clang-ARM64)
    runs-on: windows-11-arm
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout GhostPDL repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup MSYS2 CLANGARM64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            git
            make
            autoconf
            automake
            libtool
            pkg-config
            mingw-w64-clang-aarch64-toolchain

      - name: Configure GhostPDL
        run: |
          ./autogen.sh
          ./configure \
            --host=aarch64-w64-mingw32 \
            --with-arch_h="$(pwd)/arch/windows-x64-msvc.h" \
            --without-x \
            --disable-cups \
            --disable-dbus \
            --disable-gtk \
            --enable-dynamic

      - name: Build GhostPDL & Ghostscript
        run: |
          # Build standard executables and shared libraries
          make -j${NUMBER_OF_PROCESSORS}
          make -j${NUMBER_OF_PROCESSORS} so

      - name: Collect and Package Artifacts
        shell: bash
        run: |
          mkdir -p dist/bin dist/lib
          cp bin/*.exe dist/bin/ 2>/dev/null || true
          cp sobin/*.dll dist/bin/ 2>/dev/null || true
          cp sobin/*.a dist/lib/ 2>/dev/null || true

      - name: Upload Binaries (MSYS2 ClangARM64)
        uses: actions/upload-artifact@v4
        with:
          name: ghostpdl-win-arm64-clang
          path: dist/

  # ----------------------------------------------------------------------
  # Job 2: Cross-compile using MSVC (x64_arm64 NMake)
  # Uses Microsoft Visual Studio C++ Compiler targeting ARM64
  # ----------------------------------------------------------------------
  build-msvc-arm64:
    name: Build (MSVC NMake ARM64)
    runs-on: windows-11-arm
    steps:
      - name: Checkout GhostPDL repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup MSVC Cross-Compile Environment (x64 -> ARM64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64_arm64

      - name: Build GhostPDL with NMake
        shell: cmd
        run: |
          :: Use psi\msvc.mak with WIN64 and the target arch header
          nmake -f psi\msvc.mak WIN64= TARGET_ARCH_FILE=arch\windows-x64-msvc.h MAKEDLL=1

      - name: Collect MSVC Artifacts
        shell: cmd
        run: |
          mkdir dist\bin
          mkdir dist\lib
          if exist bin\*.exe copy bin\*.exe dist\bin\
          if exist bin\*.dll copy bin\*.dll dist\bin\
          if exist bin\*.lib copy bin\*.lib dist\lib\

      - name: Upload Binaries (MSVC ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: ghostpdl-win-arm64-msvc
          path: dist/
