name: Build GhostPDL for Windows ARM64 / MSVC only

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------
  # MSVC ARM64 Build
  # ---------------------------------------------------------
  build-msvc-arm64:
    name: Build (MSVC ARM64)
    runs-on: windows-11-arm
    steps:
      - name: Checkout GhostPDL
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup MSVC Cross-Compile Environment (x64 -> ARM64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64_arm64

      # Extract the nearest tag name, current timestamp, and run number
      - name: Generate Artifact Meta
        shell: cmd
        id: meta
        run: |
          # Get nearest tag name (or fallback to short commit SHA if no tag exists)
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "no-tag-${GITHUB_SHA::7}")
          
          # Format current datetime (Example: 20260828-0012)
          DATETIME=$(date +'%Y%m%d-%H%M')
          
          # Combine Tag, Datetime, and the GitHub Run Number
          # Resulting format: v1.2.3_20260828-0012_run-42
          echo "ARTIFACT_NAME=${TAG}_${DATETIME}_run-${{ github.run_number }}" >> $GITHUB_ENV


      - name: Build GhostPDL with NMake
        shell: cmd
        run: |
          nmake -f psi\msvc.mak ^
            DEVSTUDIO= ^
            RCOMP=rc.exe ^
            DONT_HAVE_SSE2=1 ^
            WIN64= ^
            TARGET_ARCH_FILE=arch\windows-x64-msvc.h ^
            MAKEDLL=1
            
      - name: Package Complete Distribution
        shell: pwsh
        run: |
          # 1. Create directories
          New-Item -ItemType Directory -Force -Path dist/bin, dist/lib, dist/Resource, dist/iccprofiles

          # 2. Copy compiled ARM64 binaries and DLLs
          Copy-Item bin/*.exe dist/bin/ -Force
          Copy-Item bin/*.dll dist/bin/ -Force
          Copy-Item bin/*.lib dist/lib/ -Force

          # 3. Copy PostScript runtime, font maps, and ICC profiles
          Copy-Item -Recurse lib/* dist/lib/ -Force
          Copy-Item -Recurse Resource/* dist/Resource/ -Force
          Copy-Item -Recurse iccprofiles/* dist/iccprofiles/ -Force

          # 4. Generate 'load-env.bat' (For CMD)
          $loadEnvBat = @'
          @echo off
          set "GS_ROOT=%~dp0"
          if "%GS_ROOT:~-1%"=="\" set "GS_ROOT=%GS_ROOT:~0,-1%"

          set "PATH=%GS_ROOT%\bin;%GS_ROOT%\lib;%PATH%"
          set "GS_LIB=%GS_ROOT%\lib;%GS_ROOT%\Resource\Init;%GS_ROOT%\Resource\Font"
          set "GS_FONTPATH=%SystemRoot%\Fonts"
          set "GS_ICC_PROFILES=%GS_ROOT%\iccprofiles"

          echo ============================================================
          echo  Ghostscript Windows ARM64 Environment Initialized (CMD)
          echo ============================================================
          echo  GS_ROOT     : %GS_ROOT%
          echo  PATH        : Added bin\ and lib\
          echo  GS_FONTPATH : %GS_FONTPATH%
          echo  Commands    : gswin64c, ps2pdf, pdf2ps, ps2ascii
          echo ============================================================
          echo.

          :: If double-clicked directly in Windows Explorer, launch an interactive shell
          if /i "%comspec% /c ``%~0` `" equ "%cmdcmdline%" (
              cmd.exe /k
          )
          '@
          $loadEnvBat | Out-File -FilePath "dist/load-env.bat" -Encoding ascii

          # 5. Generate 'run-powershell-with-env.bat' (For PowerShell)
          $runPsBat = @'
          @echo off
          set "GS_ROOT=%~dp0"
          if "%GS_ROOT:~-1%"=="\" set "GS_ROOT=%GS_ROOT:~0,-1%"

          set "PATH=%GS_ROOT%\bin;%GS_ROOT%\lib;%PATH%"
          set "GS_LIB=%GS_ROOT%\lib;%GS_ROOT%\Resource\Init;%GS_ROOT%\Resource\Font"
          set "GS_FONTPATH=%SystemRoot%\Fonts"
          set "GS_ICC_PROFILES=%GS_ROOT%\iccprofiles"

          powershell.exe -NoExit -ExecutionPolicy Bypass -Command ^
            "Write-Host '============================================================' -ForegroundColor Green; " ^
            "Write-Host ' Ghostscript Windows ARM64 Environment Initialized (PowerShell)' -ForegroundColor Green; " ^
            "Write-Host '============================================================' -ForegroundColor Green; " ^
            "Write-Host \" GS_ROOT     : $env:GS_ROOT\"; " ^
            "Write-Host \" GS_FONTPATH : $env:GS_FONTPATH\"; " ^
            "Set-Alias -Name gs -Value gswin64c.exe -Scope Global -ErrorAction SilentlyContinue; " ^
            "Write-Host ' Available  : gs, gswin64c, ps2pdf, pdf2ps, ps2ascii' -ForegroundColor Cyan; " ^
            "Write-Host '============================================================`n' -ForegroundColor Green"
          '@
          $runPsBat | Out-File -FilePath "dist/run-powershell-with-env.bat" -Encoding ascii


      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/
