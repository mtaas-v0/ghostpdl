name: Build GhostPDL for Windows ARM64 / MSVC only

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------
  # MSVC ARM64 Build
  # ---------------------------------------------------------
  build-msvc-arm64:
    name: Build (MSVC ARM64)
    runs-on: windows-11-arm
    steps:
      - name: Checkout GhostPDL
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup MSVC Cross-Compile Environment (x64 -> ARM64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64_arm64

      # Extract the nearest tag name, current timestamp, and run number
      - name: Generate Artifact Meta
        id: meta
        run: |
          # Get nearest tag name (or fallback to short commit SHA if no tag exists)
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "no-tag-${GITHUB_SHA::7}")
          
          # Format current datetime (Example: 20260828-0012)
          DATETIME=$(date +'%Y%m%d-%H%M')
          
          # Combine Tag, Datetime, and the GitHub Run Number
          # Resulting format: v1.2.3_20260828-0012_run-42
          echo "ARTIFACT_NAME=${TAG}_${DATETIME}_run-${{ github.run_number }}" >> $GITHUB_ENV


      - name: Build GhostPDL with NMake
        shell: cmd
        run: |
          nmake -f psi\msvc.mak ^
            DEVSTUDIO= ^
            RCOMP=rc.exe ^
            DONT_HAVE_SSE2=1 ^
            WIN64= ^
            TARGET_ARCH_FILE=arch\windows-x64-msvc.h ^
            MAKEDLL=1
            
      - name: Package Complete Distribution (Binaries + Libs + Resources)
        shell: cmd
        run: |
          :: 1. Create standard distribution structure
          mkdir dist\bin
          mkdir dist\lib
          mkdir dist\Resource
          mkdir dist\iccprofiles

          :: 2. Copy compiled ARM64 binaries and DLLs
          copy bin\*.exe dist\bin\
          copy bin\*.dll dist\bin\
          copy bin\*.lib dist\bin\

          :: 3. Copy ps2pdf.bat, wrapper scripts, and PostScript runtime libs
          xcopy /E /I /Y lib dist\lib

          :: 4. Copy standard font maps, CMaps, and resource tables
          xcopy /E /I /Y Resource dist\Resource

          :: 5. Copy standard ICC color profiles
          xcopy /E /I /Y iccprofiles dist\iccprofiles

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/
